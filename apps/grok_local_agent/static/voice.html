<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Farnaz Voice</title>
  <style>
    body { margin:0; font-family: Tahoma, sans-serif; background:#070708; color:#ece4d6; min-height:100vh; display:grid; place-items:center; }
    .box { width:min(440px,92vw); text-align:center; }
    h1 { letter-spacing:.2em; color:#c9a36a; font-size:14px; }
    input { width:100%; padding:10px; background:#111; color:#ece4d6; border:1px solid #2b241c; }
    button { margin-top:16px; width:140px; height:140px; border-radius:50%; border:1px solid #c9a36a; background:#7a161b; color:#fff; font-size:18px; cursor:pointer; }
    button.live { background:#2d6a32; }
    p { color:#8a8175; white-space:pre-wrap; text-align:right; }
  </style>
</head>
<body>
  <div class="box">
    <h1>FARNAZ VOICE</h1>
    <p>این صدا برای فرناز است، نه تماس زنده با گروک در این چت.</p>
    <input id="token" type="password" placeholder="WARLOCK_AGENT_TOKEN" />
    <button id="mic">بگو</button>
    <p id="you"></p>
    <p id="her"></p>
  </div>
  <script>
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const tokenEl = document.getElementById("token");
    tokenEl.value = sessionStorage.getItem("grok_agent_token") || "";
    tokenEl.onchange = () => sessionStorage.setItem("grok_agent_token", tokenEl.value.trim());
    const mic = document.getElementById("mic");
    function speak(text) {
      const u = new SpeechSynthesisUtterance(text.slice(0, 400));
      u.lang = /[\u0600-\u06FF]/.test(text) ? "fa-IR" : "en-US";
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }
    async function ask(message) {
      document.getElementById("you").textContent = "شما: " + message;
      const r = await fetch("/grok/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + tokenEl.value.trim() },
        body: JSON.stringify({ message })
      });
      const d = await r.json();
      const content = d.content || d.detail || JSON.stringify(d);
      document.getElementById("her").textContent = "فرناز: " + content;
      speak(String(content));
    }
    mic.onclick = () => {
      if (!SR) { document.getElementById("her").textContent = "این مرورگر تشخیص گفتار ندارد. Chrome را امتحان کنید."; return; }
      const rec = new SR();
      rec.lang = "fa-IR";
      rec.onstart = () => mic.classList.add("live");
      rec.onend = () => mic.classList.remove("live");
      rec.onresult = (e) => ask(e.results[0][0].transcript);
      rec.start();
    };
  </script>
</body>
</html>
